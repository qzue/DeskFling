name: Release Packages
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and package macOS DMG
        run: |
          cmake --preset macos -DDPP_WARNINGS_AS_ERRORS=ON
          cmake --build --preset macos-release
          ctest --preset macos-release --output-on-failure
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DeskFling-macOS
          path: dist/DeskFling-macOS.dmg

  windows-zip:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and package Windows x64 ZIP
        shell: pwsh
        run: |
          cmake --preset windows-msvc -DDPP_WARNINGS_AS_ERRORS=ON '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          cmake --build --preset windows-release --parallel 3
          ctest --preset windows-release --output-on-failure
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DeskFling-Windows-x64
          path: dist/DeskFling-Windows-x64.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-dmg, windows-zip]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum DeskFling-macOS.dmg DeskFling-Windows-x64.zip > SHA256SUMS.txt
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release-assets/* --clobber
          else
            gh release create "${{ github.ref_name }}" release-assets/* --generate-notes
          fi
